<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Nexus Wars (prototype)</title>

<style>
/* VOICE: arcade mobile strategy, chunky and bright. IDEA: a Clash-style battle board in a gold frame.

   TYPE: Lilita One for numbers, names and buttons; Nunito for small print. LAYOUT: HUD on top, framed board, card deck below. */
:root{--navy:#14224d;--ink:#1d2340;--gold:#ffd23f;--edge:#0a1230;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}

body{font-synthesis:none;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#2f56b0 0%,#162a63 50%,#0b1430 100%);color:#fff;font:700 14px Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
.L{font-family:"Lilita One",system-ui,sans-serif;font-weight:400;letter-spacing:.3px}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* HUD */
#hd{padding:8px 10px 8px;display:flex;flex-direction:column;gap:7px}
.hud{display:flex;align-items:center;gap:8px}body.spec footer{display:none}body.mf #sn,body.mf #sel{display:none}#nw{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:30;background:rgba(127,29,29,.92);color:#fff;font:800 13px Nunito,system-ui;padding:7px 14px;border-radius:12px;border:2px solid #fca5a5;pointer-events:none;white-space:nowrap}.clock .ttl{display:flex;justify-content:center;align-items:center;gap:3px;margin:1px -6px -1px;padding:1px 4px;gap:2px;border-radius:7px;background:rgba(10,18,48,.85);font:900 9.5px/1.25 Nunito,system-ui;text-shadow:none;white-space:nowrap}.clock .ttl i{font-style:normal;font-size:9px;opacity:.8}.clock .ttl .me{color:#93c5fd}.clock .ttl .fo{color:#fca5a5}
.side{flex:1;display:flex;align-items:center;gap:6px;background:linear-gradient(#25397a,#172760);border:2px solid var(--edge);border-radius:12px;padding:4px 8px;box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 3px 0 var(--edge)}
.side .nm{font-family:"Lilita One",system-ui;font-size:15px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.side.me .nm{color:#86efac}.side.foe .nm{color:#fca5a5}
.bar{flex:1;height:12px;background:#0a1230;border-radius:7px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(#a7f3c0,#22a35a 60%,#178a48);transition:width .3s}
.foe .bar i{background:linear-gradient(#fecaca,#e04848 60%,#b52a2a)}
.pc{font-family:"Lilita One",system-ui;font-size:14px;min-width:38px;text-align:right;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.clock{font-family:"Lilita One",system-ui;font-size:18px;background:linear-gradient(#fff0a8,#f5b70a);color:#5a3300;border:2px solid #7a4a00;border-radius:11px;padding:2px 10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 3px 0 #7a4a00;min-width:58px;text-align:center}
.res{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;background:linear-gradient(#0f1b42,#0a1230);border:2px solid #31478c;border-radius:20px;padding:2px 10px 2px 3px;font-family:"Lilita One",system-ui;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.6);white-space:nowrap}
.pill svg{width:22px;height:22px;flex:none}
.pill small{font-family:Nunito,system-ui;font-weight:900;font-size:12px;color:#86efac;text-shadow:none}
.pill.f small{color:#fca5a5}
/* board */
#mw{flex:1;position:relative;min-height:0;margin:0 8px 8px;border-radius:16px;border:3px solid var(--edge);box-shadow:0 0 0 3px #e0b04a,0 8px 18px rgba(0,0,0,.55);overflow:hidden}
#mn{position:absolute;inset:0;overflow-y:auto;display:flex;justify-content:center;background:#2c3a22;scrollbar-width:none}

canvas{display:block}#cv{touch-action:pan-y}
.rb{position:absolute;top:8px;z-index:3;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;font-family:"Lilita One",system-ui;font-size:16px;color:#fff}
#spd{right:8px}#hb{left:8px}

#info{position:absolute;left:8px;bottom:8px;z-index:3;width:220px;background:linear-gradient(#1f3070,#141f4d);color:#f3f4f6;border:3px solid #e0b04a;border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.35;box-shadow:0 0 0 2px var(--edge),0 4px 12px rgba(0,0,0,.5)}
#info b{font-family:"Lilita One",system-ui;font-weight:800;font-synthesis:none;font-size:16px}
#info[hidden]{display:none}
/* chunky buttons */
.btn{font-family:"Lilita One",system-ui;font-size:15px;color:#fff;border:2px solid var(--edge);border-radius:12px;padding:7px 12px;background:linear-gradient(#7db8ff,#2f6fe8 55%,#2459c9);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.18),0 4px 0 var(--edge);text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 1px 0 var(--edge)}
.btn.red{background:linear-gradient(#ff9a8a,#e5413a 55%,#c42d27)}
.btn.gold{background:linear-gradient(#fff0a8,#f7c21a 55%,#dc9b05);color:#4a2c00;text-shadow:0 1px 0 rgba(255,255,255,.6)}

.btn.no{filter:grayscale(.85);opacity:.6}
/* footer deck */
footer{background:linear-gradient(#20357a,#111d47);border-top:3px solid #e0b04a;box-shadow:0 -6px 14px rgba(0,0,0,.45);padding-top:8px}
#tl{display:flex;gap:6px;padding:9px 8px 6px;align-items:center;overflow-x:auto;scrollbar-width:none}.grp{flex:none;position:relative;display:flex;gap:5px;padding:10px 5px 7px;align-items:center;border:2px solid rgba(224,176,74,.75);border-radius:14px;background:rgba(5,12,40,.35)}.grp .gl{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font:800 10px/1 "Lilita One",system-ui;letter-spacing:.08em;text-transform:uppercase;color:#ffe9a8;background:#1d3170;padding:2px 7px;border:2px solid rgba(224,176,74,.75);border-radius:8px}
#tl::-webkit-scrollbar,#sn::-webkit-scrollbar{display:none}
.tab{flex:none;font-family:"Lilita One",system-ui;font-size:13px;font-weight:800;color:#fff;border:2px solid var(--edge);border-radius:12px;padding:6px 10px;background:linear-gradient(var(--c1),var(--c2));box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 var(--edge);text-shadow:0 2px 0 rgba(0,0,0,.4);opacity:.62;filter:saturate(.6);transition:transform .08s}
.tab.on{opacity:1;filter:none;transform:translateY(-2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 var(--edge),0 0 0 2px rgba(255,255,255,.85)}
.t0{--c1:#7db8ff;--c2:#2563eb}.t1{--c1:#c9a0ff;--c2:#7e22ce}.t2{--c1:#5eead4;--c2:#0d9488}.t3{--c1:#ffe27a;--c2:#d99a06;color:#4a2c00;text-shadow:0 1px 0 rgba(255,255,255,.5)}.t5{--c1:#f9a8d4;--c2:#9d174d}.t6{--c1:#ff8a7a;--c2:#b91c1c}.stk{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center}#tl .stk .tab{width:100%;font-size:12px;padding:3px 4px;border-radius:10px;white-space:nowrap}#tl .stk .tab.on{transform:translateY(-1px)}.nkb{flex:none;position:relative;width:52px;height:52px;margin:0 2px 4px 0;padding:0;border:2px solid #3b0a0a;border-radius:12px;background:radial-gradient(circle at 50% 35%,#ff6b5b,#dc2626 55%,#7f1d1d);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.3),0 5px 0 #450a0a,0 7px 10px rgba(0,0,0,.45);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.nkb svg{width:68%;height:68%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}.nkb b{position:absolute;right:-5px;top:-6px;min-width:16px;height:16px;padding:0 3px;border-radius:9px;background:#fff;color:#b91c1c;border:2px solid #3b0a0a;font:900 10px/12px Nunito,system-ui}
.nkb:active,.nkb.on{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.3),0 1px 0 #450a0a,0 0 0 3px #fff,0 0 14px #f87171}.nkb.no{filter:grayscale(.85);opacity:.45}@media(max-width:385px){.grp .tab{font-size:12px;padding:6px 7px}#tl .stk .tab{font-size:11px}}.tab.t6.no{opacity:.35}.t4{--c1:#ffb37a;--c2:#ea580c}
#sel{padding:0 10px}
.selbox{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 2px;background:linear-gradient(#fff,#e6ecfb);color:var(--ink);border:2px solid var(--edge);border-radius:12px;padding:6px 8px;box-shadow:0 3px 0 var(--edge)}
.selbox b{font-family:"Lilita One",system-ui;font-weight:800;font-synthesis:none;font-size:15px}
.selbox .mu{color:#56607f;font-size:12px}
.selbox span.act{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.selbox .btn{font-size:13px;padding:5px 9px}
#sn{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;padding:12px 12px 12px}
.card{flex:none;width:94px;position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 5px 7px;border-radius:14px;border:3px solid var(--cd);background:linear-gradient(#ffffff 0%,var(--ct) 100%);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.07),0 4px 0 var(--cd),0 7px 10px rgba(0,0,0,.35);transition:transform .08s}
.card:active{transform:translateY(3px)}
.card.f0{--cd:#1e4fb8;--ct:#dfe9ff;--cf:#3b82f6}.card.f1{--cd:#6b21a8;--ct:#efe2ff;--cf:#9333ea}.card.f2{--cd:#0f766e;--ct:#d8f6f1;--cf:#14b8a6}.card.f3{--cd:#a16207;--ct:#fff1c7;--cf:#eab308}
.card .pic{width:56px;height:56px;border-radius:50%;margin-bottom:3px;border:2px solid var(--cd);background:var(--img) center 60%/92% no-repeat,radial-gradient(circle at 50% 40%,#fff 25%,var(--ct) 75%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.card b{font-family:"Lilita One",system-ui;font-weight:800;font-synthesis:none;font-size:13px;line-height:1.1;max-width:86px;overflow:hidden;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card i{font-style:normal;font-size:10px;font-weight:800;color:#4b5578;line-height:1.2;text-align:center;margin-top:1px}.card .ln{white-space:nowrap;letter-spacing:-.3px}.card .gi{color:#a16207}
.card .cost{margin-top:5px;display:flex;align-items:center;gap:3px;background:var(--ink);color:var(--gold);border-radius:10px;padding:1px 8px 1px 2px;font-family:"Lilita One",system-ui;font-size:13px}
.card .cost svg{width:16px;height:16px}
.card .cost u{display:none;text-decoration:none;font-size:18px;line-height:16px;color:#fff;padding:0 6px}
/* Price tag = quick build: on hover it turns into a blue plus; clicking it builds in the next free spot (middle of the base first, then outward). */
.card .cost.qk{cursor:pointer;transition:background .1s}
.card .cost.qk:hover{background:linear-gradient(#60a5fa,#2563eb);box-shadow:0 0 0 2px #fff}
.card .cost.qk:hover svg,.card .cost.qk:hover span{display:none}.card .cost.qk:hover u{display:inline}
.card .cost.qk:active{transform:scale(.92)}
.card .role{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:var(--cf);border:2px solid #fff;box-shadow:0 2px 0 var(--cd);display:grid;place-items:center}
.card .role svg{width:15px;height:15px;fill:#fff}
.card em{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:linear-gradient(#86efac,#16a34a);border:2px solid #fff;box-shadow:0 2px 0 #14532d;font-style:normal;font-family:"Lilita One",system-ui;font-size:13px;color:#fff;display:grid;place-items:center;padding:0 5px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.card em[hidden]{display:none}
.card.no{filter:grayscale(.8) brightness(.9);opacity:.62}.card.f3{background:linear-gradient(#fff8dc,#ffe9a3)}.card.f3.no{filter:grayscale(.25) brightness(.95);opacity:.8}
.card.on{transform:translateY(-5px);box-shadow:0 0 0 3px var(--gold),0 9px 0 var(--cd),0 12px 14px rgba(0,0,0,.4)}
.card .lv{display:flex;gap:3px;margin-top:3px}.card .lv span{width:9px;height:9px;border-radius:50%;background:#cbd5e1;border:1px solid var(--cd)}.card .lv span.y{background:var(--gold)}
/* overlays */
#ov{position:fixed;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(20,34,77,.75),rgba(5,8,20,.88));color:#fff;z-index:5}
#ov[hidden]{display:none}
#sel .t3b{background:linear-gradient(#fde68a,#f59e0b 55%,#b45309);border-color:#451a03}#sel .t2b{background:linear-gradient(#d8b4fe,#9333ea 55%,#6b21a8);border-color:#3b0764}#sel .upb{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;padding-top:5px;padding-bottom:5px}#sel .upb small{font:800 11px Nunito,system-ui;opacity:.85;text-shadow:none}.card.f6{--ct:#ffe4e1;--cd:#b91c1c}.nkpic{background:radial-gradient(circle at 50% 50%,#facc15 0 30%,#1f1300 31% 36%,#facc15 37% 60%,#dc2626 61%)!important}.stbar{display:inline-flex;flex-wrap:wrap;gap:3px;margin-left:6px;vertical-align:middle;padding:2px 6px;border-radius:9px;background:linear-gradient(#2b3f86,#1d2b63);border:2px solid #0a1230;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}.stbar .st{display:inline-flex;align-items:center;gap:2px;color:#fff;font:800 11.5px/1.2 Nunito,system-ui;padding:0 3px}.stbar svg{width:12px;height:12px;fill:#ffd23f}.stbar .hit{color:#93c5fd}.clock .dbf{margin:2px -6px -2px;padding:0 4px;border-radius:6px;font:900 10px/1.3 Nunito,system-ui;background:#e2e8f0;color:#0f172a;text-shadow:none;animation:pulse 0.8s ease-in-out infinite alternate}.clock .dbf.fo{background:#fecaca}@keyframes pulse{to{filter:brightness(1.35)}}.selbox .mu2 b{font-size:12px}.selbox .mu2{font-size:11.5px;padding:3px 8px;margin-top:4px;color:#1e293b}.selbox .mu2.gd{background:#dcfce7}.selbox .mu2.wk{background:#fee2e2}.mu2{margin-top:6px;padding:5px 8px;border-radius:9px;font-size:12px;line-height:1.3;border:2px solid}.mu2.gd{background:rgba(22,163,74,.25);border-color:#4ade80}.mu2.wk{background:rgba(220,38,38,.25);border-color:#f87171}.mu2 b{font-weight:900}.domfx{position:fixed;inset:0;z-index:40;pointer-events:none;display:grid;place-items:center}.dfw{position:absolute;inset:0}.burst{position:absolute;width:0;height:0;animation:bst 1.1s ease-out both}.burst i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);transform:rotate(var(--a)) translateX(0);animation:spk 1.1s ease-out both;animation-delay:inherit}
@keyframes spk{0%{transform:rotate(var(--a)) translateX(0);opacity:1}80%{opacity:1}100%{transform:rotate(var(--a)) translateX(90px);opacity:0}}@keyframes bst{0%{opacity:0}5%{opacity:1}100%{opacity:1}}
.dcard{max-width:86vw;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 22px;border-radius:18px;border:3px solid #fde047;background:linear-gradient(#1e3a8a,#0b1638);color:#fff;box-shadow:0 0 40px rgba(253,224,71,.6);animation:dfly 2.2s cubic-bezier(.2,.8,.3,1) both;text-align:center}
.dcard b{font:900 54px/1 "Lilita One",system-ui;letter-spacing:.02em}.dcard.me b{color:#93c5fd}.dcard.fo b{color:#fca5a5}.dcard span{font:900 18px "Lilita One",system-ui}.dcard small{font:800 12px Nunito,system-ui;opacity:.9}
@keyframes dfly{0%{transform:translateY(-42vh) scale(.25);opacity:.4}25%{transform:translateY(0) scale(1.05);opacity:1}80%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-42vh) scale(.25);opacity:0}}.dgrid{display:grid;gap:12px;width:min(300px,84vw)}.dbtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;font-size:24px!important;padding:10px 14px!important}.dbtn small{font-family:Nunito,system-ui;font-size:12.5px;font-weight:800;text-shadow:none;opacity:.92}.dbtn.cur{outline:3px solid #fff;outline-offset:2px}.banner{font-family:"Lilita One",system-ui;font-size:46px;padding:8px 44px;border:3px solid var(--edge);border-radius:16px;box-shadow:inset 0 3px 0 rgba(255,255,255,.4),0 6px 0 var(--edge);text-shadow:0 3px 0 rgba(0,0,0,.45);background:linear-gradient(#7db8ff,#1d4ed8)}

</style></head><body>

<script>
